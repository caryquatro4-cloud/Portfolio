<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:var(--font-sans,'Anthropic Sans',sans-serif)}
#wrap{position:relative;width:100%;padding:0}
#info-panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:12px 16px;margin:10px 0 4px;min-height:56px;font-size:13px;color:var(--color-text-primary);transition:opacity .2s}
#info-panel .zone-name{font-size:14px;font-weight:500;margin-bottom:3px}
#info-panel .zone-desc{color:var(--color-text-secondary);font-size:12px;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:6px 0 10px;font-size:12px;color:var(--color-text-secondary)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
svg .zone{cursor:pointer;transition:opacity .15s}
svg .zone:hover{opacity:.78}
svg .zone.active{opacity:.65}
</style>
</head>

let active = null;
document.querySelectorAll('.zone').forEach(el => {
  el.addEventListener('click', function(){
    const id = this.id;
    const data = zoneData[id];
    if(!data) return;
    if(active) active.classList.remove('active');
    this.classList.add('active');
    active = this;
    const panel = document.getElementById('info-panel');
    panel.querySelector('.zone-name').textContent = data.name;
    panel.querySelector('.zone-desc').textContent = data.desc;
  });
});
</script>
