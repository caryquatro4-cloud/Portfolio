<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>NFL Stadium Floorplan</title>
  <desc>Top-down floorplan of an NFL stadium showing field, seating sections, gates, concourses, and amenities.</desc>

  <defs>
    <pattern id="grass" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#2d7a3a"/>
      <rect x="0" y="0" width="10" height="20" fill="#2a7237" opacity="0.5"/>
    </pattern>
    <clipPath id="tc">
      <rect x="185" y="242" width="310" height="296" rx="4"/>
    </clipPath>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="780" fill="#f5f4f0"/>

  <!-- Title -->
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#2c2c2a">NFL Stadium — Floorplan</text>

  <!-- ─── OUTER STADIUM SHELL ─── -->
  <ellipse cx="340" cy="390" rx="320" ry="370" fill="#b5b3ab" opacity="0.25" stroke="#888780" stroke-width="1"/>

  <!-- ─── UPPER DECK ─── -->
  <!-- North -->
  <path d="M130 100 Q340 30 550 100 L510 145 Q340 85 170 145 Z" fill="#534AB7" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
  <!-- South -->
  <path d="M130 680 Q340 750 550 680 L510 635 Q340 705 170 635 Z" fill="#534AB7" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
  <!-- West -->
  <path d="M30 200 Q20 390 30 580 L80 550 Q72 390 80 230 Z" fill="#534AB7" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
  <!-- East -->
  <path d="M650 200 Q660 390 650 580 L600 550 Q608 390 600 230 Z" fill="#534AB7" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
  <!-- NW corner -->
  <path d="M80 230 L130 100 L170 145 L110 260 Z" fill="#534AB7" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
  <!-- NE corner -->
  <path d="M600 230 L550 100 L510 145 L570 260 Z" fill="#534AB7" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
  <!-- SW corner -->
  <path d="M80 550 L130 680 L170 635 L110 520 Z" fill="#534AB7" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
  <!-- SE corner -->
  <path d="M600 550 L550 680 L510 635 L570 520 Z" fill="#534AB7" stroke="#fff" stroke-width="0.5" opacity="0.85"/>

  <!-- Upper deck section labels -->
  <text x="340" y="108" text-anchor="middle" font-size="9" fill="#fff" opacity="0.85">Sec 300–320 (Upper N)</text>
  <text x="340" y="705" text-anchor="middle" font-size="9" fill="#fff" opacity="0.85">Sec 361–380 (Upper S)</text>
  <text x="52" y="393" text-anchor="middle" font-size="9" fill="#fff" opacity="0.85" transform="rotate(-90,52,393)">Sec 321–340 (Upper W)</text>
  <text x="628" y="393" text-anchor="middle" font-size="9" fill="#fff" opacity="0.85" transform="rotate(90,628,393)">Sec 341–360 (Upper E)</text>

  <!-- ─── MAIN CONCOURSE ─── -->
  <path d="M170 145 Q340 85 510 145 L490 168 Q340 115 190 168 Z" fill="#3C3489" stroke="#fff" stroke-width="0.3" opacity="0.9"/>
  <path d="M170 635 Q340 705 510 635 L490 612 Q340 675 190 612 Z" fill="#3C3489" stroke="#fff" stroke-width="0.3" opacity="0.9"/>
  <path d="M80 230 L110 260 L100 520 L80 550 Q65 390 80 230 Z" fill="#3C3489" stroke="#fff" stroke-width="0.3" opacity="0.9"/>
  <path d="M600 230 L570 260 L580 520 L600 550 Q615 390 600 230 Z" fill="#3C3489" stroke="#fff" stroke-width="0.3" opacity="0.9"/>

  <!-- ─── LOWER BOWL ─── -->
  <path d="M190 168 Q340 115 490 168 L470 200 Q340 155 210 200 Z" fill="#7F77DD" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M190 612 Q340 675 490 612 L470 580 Q340 635 210 580 Z" fill="#7F77DD" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M110 260 L140 280 L140 500 L110 520 Q100 390 110 260 Z" fill="#7F77DD" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M570 260 L540 280 L540 500 L570 520 Q580 390 570 260 Z" fill="#7F77DD" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <!-- Lower corners -->
  <path d="M110 260 L140 280 L210 200 L190 168 L110 260 Z" fill="#7F77DD" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M570 260 L540 280 L470 200 L490 168 L570 260 Z" fill="#7F77DD" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M110 520 L140 500 L210 580 L190 612 Z" fill="#7F77DD" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M570 520 L540 500 L470 580 L490 612 Z" fill="#7F77DD" stroke="#fff" stroke-width="0.5" opacity="0.9"/>

  <!-- Lower bowl labels -->
  <text x="340" y="188" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">Sec 200–210 (Lower N)</text>
  <text x="340" y="600" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">Sec 228–240 (Lower S)</text>
  <text x="122" y="393" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9" transform="rotate(-90,122,393)">Sec 111–130 (W)</text>
  <text x="558" y="393" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9" transform="rotate(90,558,393)">Sec 131–150 (E)</text>

  <!-- ─── CLUB / SUITE LEVEL ─── -->
  <path d="M140 280 L160 295 L160 485 L140 500 Z" fill="#EF9F27" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M540 280 L520 295 L520 485 L540 500 Z" fill="#EF9F27" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M210 200 L470 200 L460 220 L220 220 Z" fill="#EF9F27" stroke="#fff" stroke-width="0.5" opacity="0.9"/>
  <path d="M210 580 L470 580 L460 560 L220 560 Z" fill="#EF9F27" stroke="#fff" stroke-width="0.5" opacity="0.9"/>

  <!-- Club labels -->
  <text x="340" y="213" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">Suites 1–20 (N)</text>
  <text x="340" y="574" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9">Suites 21–40 (S)</text>
  <text x="150" y="393" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9" transform="rotate(-90,150,393)">Club W</text>
  <text x="530" y="393" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9" transform="rotate(90,530,393)">Club E</text>

  <!-- ─── FIELD-LEVEL SEATS ─── -->
  <path d="M160 295 L185 308 L185 472 L160 485 Z" fill="#AFA9EC" stroke="#fff" stroke-width="0.3" opacity="0.9"/>
  <path d="M520 295 L495 308 L495 472 L520 485 Z" fill="#AFA9EC" stroke="#fff" stroke-width="0.3" opacity="0.9"/>
  <path d="M220 220 L460 220 L455 242 L225 242 Z" fill="#AFA9EC" stroke="#fff" stroke-width="0.3" opacity="0.9"/>
  <path d="M220 560 L460 560 L455 538 L225 538 Z" fill="#AFA9EC" stroke="#fff" stroke-width="0.3" opacity="0.9"/>

  <!-- ─── PLAYING FIELD ─── -->
