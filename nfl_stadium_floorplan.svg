  <!-- Locker Rooms SW -->
  <rect x="96" y="610" width="68" height="34" rx="5" fill="#639922" stroke="#fff" stroke-width="0.5"/>
  <text x="130" y="626" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Locker</text>
  <text x="130" y="638" text-anchor="middle" font-size="9" fill="#fff">Rooms</text>

  <!-- Press Box East -->
  <rect x="548" y="374" width="52" height="32" rx="5" fill="#1D9E75" stroke="#fff" stroke-width="0.5"/>
  <text x="574" y="389" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Press</text>
  <text x="574" y="401" text-anchor="middle" font-size="9" fill="#fff">Box</text>

  <!-- Concessions NW -->
  <rect x="90" y="158" width="68" height="32" rx="5" fill="#BA7517" stroke="#fff" stroke-width="0.5"/>
  <text x="124" y="173" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Concessions</text>
  <text x="124" y="184" text-anchor="middle" font-size="8" fill="#fff">NW Concourse</text>

  <!-- Concessions NE -->
  <rect x="522" y="158" width="68" height="32" rx="5" fill="#BA7517" stroke="#fff" stroke-width="0.5"/>
  <text x="556" y="173" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Concessions</text>
  <text x="556" y="184" text-anchor="middle" font-size="8" fill="#fff">NE Concourse</text>

  <!-- Concessions SW -->
  <rect x="90" y="570" width="68" height="32" rx="5" fill="#BA7517" stroke="#fff" stroke-width="0.5"/>
  <text x="124" y="585" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Concessions</text>
  <text x="124" y="596" text-anchor="middle" font-size="8" fill="#fff">SW Concourse</text>

  <!-- Concessions SE -->
  <rect x="522" y="570" width="68" height="32" rx="5" fill="#BA7517" stroke="#fff" stroke-width="0.5"/>
  <text x="556" y="585" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Concessions</text>
  <text x="556" y="596" text-anchor="middle" font-size="8" fill="#fff">SE Concourse</text>

  <!-- Restrooms W upper -->
  <rect x="38" y="298" width="44" height="28" rx="5" fill="#185FA5" stroke="#fff" stroke-width="0.5"/>
  <text x="60" y="313" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Restrooms</text>
  <text x="60" y="322" text-anchor="middle" font-size="8" fill="#fff">W Upper</text>

  <!-- Restrooms E upper -->
  <rect x="598" y="298" width="44" height="28" rx="5" fill="#185FA5" stroke="#fff" stroke-width="0.5"/>
  <text x="620" y="313" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Restrooms</text>
  <text x="620" y="322" text-anchor="middle" font-size="8" fill="#fff">E Upper</text>

  <!-- Restrooms W lower -->
  <rect x="38" y="450" width="44" height="28" rx="5" fill="#185FA5" stroke="#fff" stroke-width="0.5"/>
  <text x="60" y="465" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Restrooms</text>
  <text x="60" y="474" text-anchor="middle" font-size="8" fill="#fff">W Lower</text>

  <!-- Restrooms E lower -->
  <rect x="598" y="450" width="44" height="28" rx="5" fill="#185FA5" stroke="#fff" stroke-width="0.5"/>
  <text x="620" y="465" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Restrooms</text>
  <text x="620" y="474" text-anchor="middle" font-size="8" fill="#fff">E Lower</text>

  <!-- Team Store SE -->
  <rect x="546" y="610" width="56" height="34" rx="5" fill="#993C1D" stroke="#fff" stroke-width="0.5"/>
  <text x="574" y="626" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Team</text>
  <text x="574" y="638" text-anchor="middle" font-size="9" fill="#fff">Store</text>

  <!-- Medical / First Aid -->
  <rect x="296" y="734" width="88" height="28" rx="5" fill="#A32D2D" stroke="#fff" stroke-width="0.5"/>
  <text x="340" y="748" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Medical / First Aid</text>
  <text x="340" y="758" text-anchor="middle" font-size="8" fill="#fff">Gate B — Inside</text>

  <!-- ─── LEGEND ─── -->
  <rect x="30" y="735" width="240" height="36" rx="6" fill="#fff" stroke="#ccc" stroke-width="0.5" opacity="0.9"/>
  <!-- row 1 -->
  <rect x="38" y="742" width="10" height="10" rx="2" fill="#534AB7"/>
  <text x="52" y="751" font-size="8" fill="#444">Upper deck</text>
  <rect x="95" y="742" width="10" height="10" rx="2" fill="#7F77DD"/>
  <text x="109" y="751" font-size="8" fill="#444">Lower bowl</text>
  <rect x="155" y="742" width="10" height="10" rx="2" fill="#EF9F27"/>
  <text x="169" y="751" font-size="8" fill="#444">Club/suites</text>
  <rect x="210" y="742" width="10" height="10" rx="2" fill="#AFA9EC"/>
  <text x="224" y="751" font-size="8" fill="#444">Field level</text>
  <!-- row 2 -->
  <rect x="38" y="757" width="10" height="10" rx="2" fill="#D85A30"/>
  <text x="52" y="766" font-size="8" fill="#444">Gates</text>
  <rect x="95" y="757" width="10" height="10" rx="2" fill="#BA7517"/>
  <text x="109" y="766" font-size="8" fill="#444">Concessions</text>
  <rect x="155" y="757" width="10" height="10" rx="2" fill="#185FA5"/>
  <text x="169" y="766" font-size="8" fill="#444">Restrooms</text>
  <rect x="210" y="757" width="10" height="10" rx="2" fill="#2d7a3a"/>
  <text x="224" y="766" font-size="8" fill="#444">Field</text>

  <!-- Compass / North indicator -->
  <text x="630" y="750" text-anchor="middle" font-size="13" font-weight="700" fill="#444">N</text>
  <line x1="630" y1="753" x2="630" y2="768" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L5 10 L10 0 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- North label -->
  <text x="340" y="775" text-anchor="middle" font-size="10" fill="#888">↑ North Parking / Transit</text>
</svg>
