  <line x1="247" y1="282" x2="247" y2="498" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  <line x1="278" y1="282" x2="278" y2="498" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  <line x1="309" y1="282" x2="309" y2="498" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  <line x1="340" y1="282" x2="340" y2="498" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <line x1="371" y1="282" x2="371" y2="498" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  <line x1="402" y1="282" x2="402" y2="498" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  <line x1="433" y1="282" x2="433" y2="498" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  <line x1="464" y1="282" x2="464" y2="498" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  <!-- Mid-field line -->
  <line x1="185" y1="390" x2="495" y2="390" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <!-- End zone text -->
  <text x="340" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" opacity="0.9">END ZONE</text>
  <text x="340" y="520" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" opacity="0.9">END ZONE</text>
  <!-- 50 yd label -->
  <text x="340" y="387" text-anchor="middle" font-size="9" fill="#fff" opacity="0.5">50 YD LINE</text>

  <!-- ─── GATES ─── -->
  <!-- Gate A North -->
  <rect x="290" y="52" width="100" height="30" rx="6" fill="#D85A30" stroke="#fff" stroke-width="0.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Gate A — Main N</text>
  <!-- Gate B South -->
  <rect x="290" y="698" width="100" height="30" rx="6" fill="#D85A30" stroke="#fff" stroke-width="0.5"/>
  <text x="340" y="718" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Gate B — South</text>
  <!-- Gate C West -->
  <rect x="8" y="365" width="30" height="50" rx="6" fill="#D85A30" stroke="#fff" stroke-width="0.5"/>
  <text x="23" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" transform="rotate(-90,23,390)">Gate C</text>
  <!-- Gate D East -->
  <rect x="642" y="365" width="30" height="50" rx="6" fill="#D85A30" stroke="#fff" stroke-width="0.5"/>
  <text x="657" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" transform="rotate(90,657,390)">Gate D</text>

